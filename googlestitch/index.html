<!DOCTYPE html>
<html lang="en" class="">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>PulseGuard Operations Command Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            brand: {
              DEFAULT: '#2563eb',
              hover: '#1d4ed8',
              subtle: '#eff6ff',
            },
            "status-critical": "#DC2626",
            "status-warning": "#D97706",
            "status-advisory": "#2563EB",
            "status-success": "#059669"
          }
        }
      }
    };
  </script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      background-color: #F9FAFB;
      color: #111827;
    }
    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }
    *, ::before, ::after {
      box-shadow: none !important;
      text-shadow: none !important;
    }
    ::-webkit-scrollbar {
      display: none;
    }
  </style>

  <!-- React & Router Dependencies -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/history@5/umd/history.development.js"></script>
  <script src="https://unpkg.com/react-router@6.3.0/umd/react-router.development.js"></script>
  <script src="https://unpkg.com/react-router-dom@6.3.0/umd/react-router-dom.development.js"></script>
  <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
</head>
<body class="min-h-screen flex flex-col bg-[#F9FAFB] text-[#111827]">
  <div id="root" class="min-h-screen flex flex-col"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const { createRoot } = ReactDOM;
    const { MemoryRouter, Routes, Route, Link, useNavigate, useLocation } = ReactRouterDOM;

    // Toast Context / Global Notification State
    const Toast = ({ toast, onClose }) => {
      if (!toast.visible) return null;
      return (
        <div className="fixed bottom-6 right-6 z-[100] bg-white border border-[#E5E7EB] rounded-lg p-3.5 flex items-center gap-3 shadow-none">
          <span className="material-symbols-outlined text-[#059669] text-[20px]">check_circle</span>
          <div className="text-xs">
            <span className="font-medium text-[#111827] block">{toast.title}</span>
            <span className="text-[#6B7280] text-[11px]">{toast.msg}</span>
          </div>
          <button onClick={onClose} className="ml-2 text-[#9CA3AF] hover:text-[#111827]">
            <span className="material-symbols-outlined text-[16px]">close</span>
          </button>
        </div>
      );
    };

    // Shared Header Component
    const Header = ({ audioOn, setAudioOn, activeSector, setActiveSector }) => {
      const location = useLocation();

      return (
        <header className="w-full bg-white border-b border-[#E5E7EB] sticky top-0 z-40">
          <div className="max-w-[1720px] mx-auto h-16 px-6 flex items-center justify-between gap-4">
            <div className="flex items-center gap-6">
              {/* Brand */}
              <div className="flex items-center gap-3 pr-4 md:border-r md:border-[#E5E7EB]">
                <div className="w-8 h-8 rounded-lg bg-[#2563EB] flex items-center justify-center text-white">
                  <span className="material-symbols-outlined text-[20px]">radar</span>
                </div>
                <div>
                  <div className="text-[14px] font-semibold text-[#111827] leading-tight">PulseGuard Ops</div>
                  <div className="text-[12px] text-[#6B7280]">Regional Venue · Live Operations</div>
                </div>
              </div>

              {/* Status pill */}
              <div className="hidden xl:flex items-center gap-2 px-2.5 py-1 bg-[#F9FAFB] border border-[#E5E7EB] rounded-lg text-[12px]">
                <span className="w-2 h-2 rounded-full bg-[#059669]"></span>
                <span className="text-[#6B7280]">Live Telemetry</span>
                <span className="font-medium text-[#111827] tabular-nums">99.8%</span>
                <span className="text-gray-300">|</span>
                <span className="tabular-nums text-[#111827]">21:42:15 CEST</span>
              </div>

              {/* Navigation Tabs */}
              <nav className="flex items-center gap-1">
                <Link
                  to="/"
                  className={`px-3 py-1.5 rounded-lg text-[13px] font-medium transition-colors ${
                    location.pathname === '/' 
                      ? 'bg-[#EFF6FF] text-[#2563EB] font-semibold' 
                      : 'text-[#6B7280] hover:text-[#111827] hover:bg-[#F9FAFB]'
                  }`}
                >
                  Live Crowd Map
                </Link>
                <Link
                  to="/alerts"
                  className={`px-3 py-1.5 rounded-lg text-[13px] font-medium transition-colors flex items-center gap-1.5 ${
                    location.pathname === '/alerts' 
                      ? 'bg-[#EFF6FF] text-[#2563EB] font-semibold' 
                      : 'text-[#6B7280] hover:text-[#111827] hover:bg-[#F9FAFB]'
                  }`}
                >
                  Alerts & Actions
                  <span className="px-1.5 py-0.2 rounded-full bg-[#FEE2E2] text-[#DC2626] text-[11px] font-semibold tabular-nums">
                    3
                  </span>
                </Link>
                <Link
                  to="/decisions"
                  className={`px-3 py-1.5 rounded-lg text-[13px] font-medium transition-colors ${
                    location.pathname === '/decisions' 
                      ? 'bg-[#EFF6FF] text-[#2563EB] font-semibold' 
                      : 'text-[#6B7280] hover:text-[#111827] hover:bg-[#F9FAFB]'
                  }`}
                >
                  Decision Log
                </Link>
              </nav>
            </div>

            {/* Right Utilities */}
            <div className="flex items-center gap-3">
              <div className="hidden md:flex items-center rounded-lg border border-[#E5E7EB] bg-white px-2.5 py-1 text-xs">
                <span className="text-[#6B7280] mr-1.5">Sector:</span>
                <select 
                  value={activeSector} 
                  onChange={(e) => setActiveSector(e.target.value)}
                  className="bg-transparent text-[12px] font-medium text-[#111827] border-0 p-0 focus:ring-0 cursor-pointer"
                >
                  <option value="ALL">All Sectors (A–E)</option>
                  <option value="A">Sector A · North Transit</option>
                  <option value="B">Sector B · Mid West/East</option>
                  <option value="C">Sector C · Central Arena</option>
                  <option value="D">Sector D · Food & Corridor</option>
                  <option value="E">Sector E · South Entry C</option>
                </select>
              </div>

              <button 
                onClick={() => setAudioOn(!audioOn)}
                className={`h-8 px-2.5 rounded-lg border border-[#E5E7EB] text-[12px] flex items-center gap-1.5 transition-colors ${
                  audioOn ? 'bg-[#F9FAFB] text-[#111827]' : 'bg-white text-[#9CA3AF]'
                }`}
                title="Toggle Audio Cues"
              >
                <span className="material-symbols-outlined text-[16px]">{audioOn ? 'volume_up' : 'volume_off'}</span>
                <span className="hidden sm:inline">{audioOn ? 'Audio On' : 'Muted'}</span>
              </button>

              <div className="flex items-center gap-2 pl-2 border-l border-[#E5E7EB]">
                <div className="w-8 h-8 rounded-full bg-[#E5E7EB] flex items-center justify-center text-[12px] font-semibold text-[#111827]">
                  RV
                </div>
                <div className="hidden sm:flex flex-col text-left">
                  <span className="text-[12px] font-medium text-[#111827] leading-tight">Cmdr. Vance</span>
                  <span className="text-[11px] text-[#6B7280]">Duty Lead · L4</span>
                </div>
              </div>
            </div>
          </div>
        </header>
      );
    };

    // Shared Operational Footer
    const Footer = () => (
      <footer className="w-full bg-white border-t border-[#E5E7EB] py-3 px-6 mt-auto">
        <div className="max-w-[1720px] mx-auto flex flex-col sm:flex-row items-center justify-between gap-2 text-[12px] text-[#6B7280]">
          <div>SEC-OPS OS v4.18.2 · PulseGuard Platform · Authorized Personnel Only</div>
          <div className="flex items-center gap-4 tabular-nums">
            <span>AES-256 GCM</span>
            <span>Node: EU-Central-01</span>
            <span>Audit Ledger Active</span>
          </div>
        </div>
      </footer>
    );

    // ==========================================
    // SCREEN 1: DECISION LOG COMPONENT
    // ==========================================
    const DecisionLogScreen = ({ onShowToast }) => {
      const [search, setSearch] = useState('');
      const [filterZone, setFilterZone] = useState('ALL');
      const [filterSeverity, setFilterSeverity] = useState('ALL');
      const [filterStatus, setFilterStatus] = useState('ALL');
      const [briefingOpen, setBriefingOpen] = useState(false);

      const decisionRecords = [
        {
          id: 'REC-0492',
          time: '21:38:04 (4 mins ago)',
          severity: 'CRITICAL',
          status: 'OVERRIDDEN',
          statusLabel: 'Overridden & Escalated',
          zone: 'Entry C',
          targetZone: 'Entry C (Sector E3)',
          subZone: 'Turnstiles C1–C6 Entrance',
          forecast: '94% Density',
          forecastSub: 'in 18 min',
          operator: 'Vance, R. (Commander)',
          operatorRole: 'Duty Lead Level 4',
          directive: 'Deploy 4 static staff & hold turnstile 3 intermittently to decelerate ingress rate.',
          actionTaken: 'Dispatched 4 rapid response officers (Unit 7) & opened secondary bypass Entry C-2.',
          resolution: 'Stabilized at 78% — overcrowding averted',
          tag: 'Successful Diversion'
        },
        {
          id: 'REC-0491',
          time: '21:15:32 (27 mins ago)',
          severity: 'WARNING',
          status: 'EXECUTED',
          statusLabel: 'Executed as Recommended',
          zone: 'Central Arena',
          targetZone: 'Central Arena East Barrier',
          subZone: 'Headline Set: Crowd Surge 2',
          forecast: '91% Density',
          forecastSub: 'in 30 min',
          operator: 'Vance, R. (Commander)',
          operatorRole: 'Duty Lead Level 4',
          directive: 'Engage pulse wave crowd calming protocol across secondary PA clusters.',
          actionTaken: 'Engaged audio-visual buffer message on East towers and illuminated periphery egress LEDs.',
          resolution: 'Flow slowed by 22% • Compression averted at front-of-house',
          tag: 'Acoustic Dampening'
        },
        {
          id: 'REC-0488',
          time: '20:42:10 (1 hr ago)',
          severity: 'ADVISORY',
          status: 'EXECUTED',
          statusLabel: 'Executed',
          zone: 'Food & Retail',
          targetZone: 'Food & Retail Plaza',
          subZone: 'Central Promenade Concourse',
          forecast: '88% Density',
          forecastSub: 'bottleneck',
          operator: 'Alvarez, M. (Deputy)',
          operatorRole: 'Crowd Dynamics Lead',
          directive: 'Reroute pedestrian lane via South Path & open overflow hydration hub.',
          actionTaken: 'Deployed directional LED signage & 2 crowd marshals to shepherd traffic towards South Path.',
          resolution: 'Queue wait time dropped from 19m to 6 mins',
          tag: 'Bottleneck Resolved'
        },
        {
          id: 'REC-0482',
          time: '20:05:44 (Day 2 Surge)',
          severity: 'CRITICAL',
          status: 'EXECUTED',
          statusLabel: 'Resolved / Normalized',
          zone: 'Entry A',
          targetZone: 'Entry A (North Entrance)',
          subZone: 'Transit Interchange Drop',
          forecast: '96% Density',
          forecastSub: 'opening peak',
          operator: 'Alvarez, M. (Deputy)',
          operatorRole: 'Crowd Dynamics Lead',
          directive: 'Open 3 secondary magnetic screening lanes and notify municipal bus arrival pacing.',
          actionTaken: 'Opened screening lanes A4–A6; requested transit dispatch hold of 6 minutes between buses.',
          resolution: 'Perimeter cleared in 14 min • Ingress normalized to 240/min',
          tag: 'Verified Clean'
        }
      ];

      const filteredRecords = decisionRecords.filter(item => {
        const query = search.toLowerCase();
        const matchesQuery = !query || 
          item.id.toLowerCase().includes(query) ||
          item.operator.toLowerCase().includes(query) ||
          item.targetZone.toLowerCase().includes(query) ||
          item.directive.toLowerCase().includes(query) ||
          item.actionTaken.toLowerCase().includes(query);
        const matchesZone = (filterZone === 'ALL') || item.zone === filterZone;
        const matchesSeverity = (filterSeverity === 'ALL') || item.severity === filterSeverity;
        const matchesStatus = (filterStatus === 'ALL') || item.status === filterStatus;
        return matchesQuery && matchesZone && matchesSeverity && matchesStatus;
      });

      return (
        <main className="w-full flex-1 max-w-[1600px] mx-auto px-6 py-6 flex flex-col gap-6">
          {/* Header */}
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-2 border-b border-[#E5E7EB]">
            <div>
              <h1 className="text-[20px] font-semibold text-[#111827] leading-tight">Tactical Decision Log</h1>
              <p className="text-xs text-[#6B7280] mt-1">
                Real-time incident interventions, predictive overrides, and chain-of-custody event forensics.
              </p>
            </div>
            <div className="flex items-center gap-3">
              <button 
                onClick={() => onShowToast('Audit Export Generated', 'Immutable event packet compiled in .PDF format.')}
                className="px-3.5 py-2 bg-[#F9FAFB] hover:bg-gray-100 text-[#111827] border border-[#E5E7EB] rounded-lg text-xs font-medium transition-colors flex items-center gap-2"
              >
                <span className="material-symbols-outlined text-[16px] text-[#6B7280]">file_download</span>
                Export Audit (.PDF/.CSV)
              </button>
              <button 
                onClick={() => setBriefingOpen(true)}
                className="px-3.5 py-2 bg-[#2563EB] hover:bg-[#1D4ED8] text-white rounded-lg text-xs font-medium transition-colors flex items-center gap-2"
              >
                <span className="material-symbols-outlined text-[16px]">badge</span>
                Shift Handover Briefing
              </button>
            </div>
          </div>

          {/* Metric Tiles */}
          <section className="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div className="bg-[#F9FAFB] border border-[#E5E7EB] rounded-lg p-4 flex flex-col justify-between">
              <div className="flex items-center justify-between text-xs text-[#6B7280]">
                <span>Total Interventions</span>
                <span className="material-symbols-outlined text-[16px]">bolt</span>
              </div>
              <div className="mt-2 flex items-baseline gap-2">
                <span className="text-2xl font-semibold text-[#111827] tabular-nums">19</span>
                <span className="text-xs text-[#6B7280]">/ 8h shift</span>
              </div>
              <div className="mt-1 text-[12px] text-[#2563EB] tabular-nums font-medium">
                +3 from previous rotation
              </div>
            </div>

            <div className="bg-[#F9FAFB] border border-[#E5E7EB] rounded-lg p-4 flex flex-col justify-between">
              <div className="flex items-center justify-between text-xs text-[#6B7280]">
                <span>Surges Prevented</span>
                <span className="material-symbols-outlined text-[16px]">crisis_alert</span>
              </div>
              <div className="mt-2 flex items-baseline gap-2">
                <span className="text-2xl font-semibold text-[#111827] tabular-nums">07</span>
                <span className="text-xs text-[#6B7280]">critical densities</span>
              </div>
              <div className="mt-1 text-[12px] text-[#059669] tabular-nums font-medium">
                100% barrier integrity
              </div>
            </div>

            <div className="bg-[#F9FAFB] border border-[#E5E7EB] rounded-lg p-4 flex flex-col justify-between">
              <div className="flex items-center justify-between text-xs text-[#6B7280]">
                <span>Mean Time to Resolution</span>
                <span className="material-symbols-outlined text-[16px]">timer</span>
              </div>
              <div className="mt-2 flex items-baseline gap-2">
                <span className="text-2xl font-semibold text-[#111827] tabular-nums">3.4m</span>
                <span className="text-xs text-[#6B7280]">average</span>
              </div>
              <div className="mt-1 text-[12px] text-[#059669] tabular-nums font-medium">
                -42s faster than benchmark
              </div>
            </div>

            <div className="bg-[#F9FAFB] border border-[#E5E7EB] rounded-lg p-4 flex flex-col justify-between">
              <div className="flex items-center justify-between text-xs text-[#6B7280]">
                <span>Algorithm Accuracy</span>
                <span className="material-symbols-outlined text-[16px]">analytics</span>
              </div>
              <div className="mt-2 flex items-baseline gap-2">
                <span className="text-2xl font-semibold text-[#111827] tabular-nums">94.2%</span>
                <span className="text-xs text-[#6B7280]">confidence</span>
              </div>
              <div className="mt-1 text-[12px] text-[#6B7280] tabular-nums">
                84 models aggregated
              </div>
            </div>
          </section>

          {/* Search & Filter Toolbar */}
          <section className="bg-[#F9FAFB] border border-[#E5E7EB] rounded-lg p-3">
            <div className="flex flex-col lg:flex-row gap-3 items-stretch lg:items-center justify-between">
              <div className="relative flex-1 max-w-md">
                <span className="material-symbols-outlined absolute inset-y-0 left-0 pl-2.5 flex items-center text-[18px] text-[#6B7280] pointer-events-none">
                  search
                </span>
                <input 
                  value={search}
                  onChange={(e) => setSearch(e.target.value)}
                  className="w-full pl-9 pr-3 py-1.5 bg-white border border-[#E5E7EB] rounded-lg text-xs text-[#111827] placeholder:text-[#6B7280] focus:outline-none focus:border-[#2563EB]" 
                  placeholder="Search by operator, directive, zone, or ID..." 
                  type="text"
                />
              </div>

              <div className="flex flex-wrap items-center gap-2">
                <div className="flex items-center bg-white border border-[#E5E7EB] rounded-lg px-2.5 py-1">
                  <span className="text-[12px] text-[#6B7280] mr-2">Zone:</span>
                  <select 
                    value={filterZone} 
                    onChange={(e) => setFilterZone(e.target.value)}
                    className="bg-transparent text-xs text-[#111827] focus:outline-none cursor-pointer"
                  >
                    <option value="ALL">All Zones</option>
                    <option value="Entry A">Entry A (North)</option>
                    <option value="Entry C">Entry C (East)</option>
                    <option value="Central Arena">Central Arena</option>
                    <option value="Food & Retail">Food & Retail</option>
                  </select>
                </div>

                <div className="flex items-center bg-white border border-[#E5E7EB] rounded-lg px-2.5 py-1">
                  <span className="text-[12px] text-[#6B7280] mr-2">Severity:</span>
                  <select 
                    value={filterSeverity} 
                    onChange={(e) => setFilterSeverity(e.target.value)}
                    className="bg-transparent text-xs text-[#111827] focus:outline-none cursor-pointer"
                  >
                    <option value="ALL">All Severity</option>
                    <option value="CRITICAL">Critical</option>
                    <option value="WARNING">Warning</option>
                    <option value="ADVISORY">Advisory</option>
                  </select>
                </div>

                <div className="flex items-center bg-white border border-[#E5E7EB] rounded-lg px-2.5 py-1">
                  <span className="text-[12px] text-[#6B7280] mr-2">Status:</span>
                  <select 
                    value={filterStatus} 
                    onChange={(e) => setFilterStatus(e.target.value)}
                    className="bg-transparent text-xs text-[#111827] focus:outline-none cursor-pointer"
                  >
                    <option value="ALL">All Status</option>
                    <option value="EXECUTED">Executed</option>
                    <option value="OVERRIDDEN">Overridden</option>
                  </select>
                </div>

                <button 
                  onClick={() => {
                    setSearch('');
                    setFilterZone('ALL');
                    setFilterSeverity('ALL');
                    setFilterStatus('ALL');
                  }}
                  className="p-1.5 bg-white border border-[#E5E7EB] rounded-lg text-[#6B7280] hover:text-[#111827] hover:bg-gray-50 transition-colors" 
                  title="Reset Filters"
                >
                  <span className="material-symbols-outlined text-[16px] block">restart_alt</span>
                </button>
              </div>
            </div>
          </section>

          {/* Main 2-Column Feed */}
          <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
            <section className="lg:col-span-8 flex flex-col space-y-4">
              <div className="flex items-center justify-between px-1">
                <div className="flex items-center gap-2">
                  <h2 className="text-sm font-semibold text-[#111827]">Chronological Interventions</h2>
                  <span className="px-2 py-0.5 text-[11px] font-medium bg-[#F9FAFB] text-[#6B7280] border border-[#E5E7EB] rounded">
                    {filteredRecords.length} {filteredRecords.length === 1 ? 'entry' : 'entries'}
                  </span>
                </div>
                <span className="text-[12px] text-[#6B7280]">Auto-refresh: 10s</span>
              </div>

              {filteredRecords.map(item => (
                <article key={item.id} className="bg-[#F9FAFB] border border-[#E5E7EB] rounded-lg p-5 flex flex-col gap-4">
                  <div className="flex flex-wrap items-center justify-between gap-2 pb-3 border-b border-[#E5E7EB]">
                    <div className="flex items-center gap-2">
                      <span className={`w-2 h-2 rounded-full ${
                        item.severity === 'CRITICAL' ? 'bg-[#DC2626]' : item.severity === 'WARNING' ? 'bg-[#D97706]' : 'bg-[#2563EB]'
                      }`}></span>
                      <span className={`text-xs font-semibold uppercase tracking-wide ${
                        item.severity === 'CRITICAL' ? 'text-[#DC2626]' : item.severity === 'WARNING' ? 'text-[#D97706]' : 'text-[#2563EB]'
                      }`}>
                        {item.severity}
                      </span>
                      <span className="text-gray-300">·</span>
                      <span className="text-xs text-[#6B7280] font-mono tabular-nums">{item.id}</span>
                      <span className="text-gray-300">·</span>
                      <span className="text-xs text-[#6B7280] tabular-nums">{item.time}</span>
                    </div>
                    <div className={`flex items-center gap-1.5 text-xs font-medium ${
                      item.status === 'OVERRIDDEN' ? 'text-[#D97706]' : 'text-[#059669]'
                    }`}>
                      <span className="material-symbols-outlined text-[15px]">
                        {item.status === 'OVERRIDDEN' ? 'edit_note' : 'done_all'}
                      </span>
                      {item.statusLabel}
                    </div>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-3 gap-3 text-xs">
                    <div>
                      <span className="text-[12px] text-[#6B7280] block">Target Zone</span>
                      <span className="font-medium text-[#111827] block mt-0.5">{item.targetZone}</span>
                      <span className="text-[12px] text-[#6B7280]">{item.subZone}</span>
                    </div>
                    <div>
                      <span className="text-[12px] text-[#6B7280] block">Algorithm Forecast</span>
                      <div className="flex items-center gap-1.5 mt-0.5">
                        <span className={`font-semibold tabular-nums ${item.severity === 'CRITICAL' ? 'text-[#DC2626]' : 'text-[#111827]'}`}>
                          {item.forecast}
                        </span>
                        <span className="text-[#6B7280]">{item.forecastSub}</span>
                      </div>
                    </div>

                            Ambient temperature at 28.5°C driving queue spillover into the secondary transit lane. Current wait time 9.5 mins (benchmark: 3 mins).
                          </p>
                          <div className="mt-2 text-[13px] font-medium text-[#111827]">
                            Recommended Action: Send mobile water distribution quad #2 to relieve queue pressure.
                          </div>
                        </div>
                        <div className="bg-white p-3 rounded-lg border border-[#E5E7EB] text-right min-w-[150px]">
                          <span className="text-[11px] text-[#6B7280] block">Quad Unit #2</span>
                          <span className="font-medium text-[#111827] text-[13px]">Standby: Zone D</span>
                          <span className="text-[12px] text-[#2563EB] block font-medium tabular-nums mt-0.5">2 min transit</span>
                        </div>
                      </div>
                      <div className="pt-2 flex flex-wrap items-center gap-3">
                        <button 
                          disabled={dispatchedCards['c3']}
                          onClick={() => openConfirmModal('Mobile Water Quad Unit #2 Deploy', 'c3')}
                          className={`px-4 py-2 rounded-lg text-[13px] font-medium transition-colors ${
                            dispatchedCards['c3'] 
                              ? 'bg-gray-200 text-[#6B7280] cursor-not-allowed' 
                              : 'bg-[#2563EB] hover:bg-[#1D4ED8] text-white'
                          }`}
                        >
                          {dispatchedCards['c3'] ? 'Quad #2 En Route' : 'Confirm Action'}
                        </button>
                        <button 
                          onClick={() => {
                            setDeferredCards(prev => ({ ...prev, c3: true }));
                            onShowToast('Action Deferred', 'Hydration queue notice postponed 10 minutes.');
                          }}
                          className="px-3.5 py-2 bg-white text-[#111827] border border-[#E5E7EB] rounded-lg text-[13px] font-medium hover:bg-[#F3F4F6] transition-colors"
                        >
                          Defer 10 Min
                        </button>
                        <span className="text-[12px] text-[#6B7280] ml-auto tabular-nums">Auto-escalates if delta reaches +60%</span>
                      </div>
                    </div>
                  </article>
                )}
              </div>

              {/* Sidebar Utilities (4 cols) */}
              <div className="lg:col-span-4 flex flex-col gap-5">
                {/* Tactical Radio Switchboard */}
                <div className="bg-[#F9FAFB] border border-[#E5E7EB] rounded-lg p-4">
                  <div className="flex items-center justify-between pb-3 border-b border-[#E5E7EB]">
                    <div className="flex items-center gap-2">
                      <span className="material-symbols-outlined text-[16px] text-[#6B7280]">settings_voice</span>
                      <span className="text-[13px] font-semibold text-[#111827]">Tactical Comm Channels</span>
                    </div>
                    <span className="w-2 h-2 rounded-full bg-[#059669]"></span>
                  </div>
                  <div className="mt-3 flex flex-col gap-2">
                    <div className={`p-3 rounded-lg border flex items-center justify-between transition-colors ${
                      activeChannel === '1' ? 'bg-white border-[#2563EB]' : 'bg-white border-[#E5E7EB]'
                    }`}>
                      <div>
                        <div className="text-[13px] font-semibold text-[#111827]">Ch 1: Command & Safety</div>
                        <div className="text-[11px] text-[#6B7280] tabular-nums">18 receptors · Open TX</div>
                      </div>
                      {activeChannel === '1' ? (
                        <span className="px-2 py-0.5 bg-[#EFF6FF] text-[#2563EB] text-[11px] font-medium rounded">Live</span>
                      ) : (
                        <button onClick={() => setActiveChannel('1')} className="px-2.5 py-1 bg-[#F9FAFB] border border-[#E5E7EB] rounded text-[12px] font-medium">Switch</button>
                      )}
                    </div>

                    <div className={`p-3 rounded-lg border flex items-center justify-between transition-colors ${
                      activeChannel === '2' ? 'bg-white border-[#2563EB]' : 'bg-white border-[#E5E7EB]'
                    }`}>
                      <div>
                        <div className="text-[13px] font-medium text-[#111827]">Ch 2: Gate Sectors A–D</div>
                        <div className="text-[11px] text-[#6B7280]">Team Lead 4 · Active Traffic</div>
                      </div>
                      {activeChannel === '2' ? (
                        <span className="px-2 py-0.5 bg-[#EFF6FF] text-[#2563EB] text-[11px] font-medium rounded">Live</span>
                      ) : (
                        <button onClick={() => setActiveChannel('2')} className="px-2.5 py-1 bg-[#F9FAFB] border border-[#E5E7EB] rounded text-[12px] font-medium">Switch</button>
                      )}
                    </div>

                    <div className={`p-3 rounded-lg border flex items-center justify-between transition-colors ${
                      activeChannel === '3' ? 'bg-white border-[#2563EB]' : 'bg-white border-[#E5E7EB]'
                    }`}>
                      <div>
                        <div className="text-[13px] font-medium text-[#111827]">Ch 3: Medical & Hydration</div>
                        <div className="text-[11px] text-[#6B7280]">Med-Tent 1 & 2 · Standby</div>
                      </div>
                      {activeChannel === '3' ? (
                        <span className="px-2 py-0.5 bg-[#EFF6FF] text-[#2563EB] text-[11px] font-medium rounded">Live</span>
                      ) : (
                        <button onClick={() => setActiveChannel('3')} className="px-2.5 py-1 bg-[#F9FAFB] border border-[#E5E7EB] rounded text-[12px] font-medium">Switch</button>
                      )}
                    </div>
                  </div>
                  <div className="mt-3 pt-3 border-t border-[#E5E7EB] flex items-center justify-between text-[11px] text-[#6B7280]">
                    <span>Codec: OPUS 24k</span>
                    <button onClick={() => onShowToast('Audio Hardware', 'PTT peripheral tested normal.')} className="text-[#2563EB] hover:underline font-medium">PTT Settings</button>
                  </div>
                </div>

                {/* Realtime Sector Gauges */}
                <div className="bg-[#F9FAFB] border border-[#E5E7EB] rounded-lg p-4">
                  <div className="flex items-center justify-between pb-3 border-b border-[#E5E7EB]">
                    <span className="text-[13px] font-semibold text-[#111827]">Real-Time Sector Sensors</span>
                    <span className="text-[11px] text-[#6B7280] tabular-nums">Refreshed 3s ago</span>
                  </div>
                  <div className="mt-4 space-y-3.5">
                    <div>
                      <div className="flex justify-between text-[12px] mb-1">
                        <span className="font-medium text-[#111827]">Sec A // Central Arena</span>
                        <span className="text-[#D97706] font-medium tabular-nums">88%</span>
                      </div>
                      <div className="w-full bg-[#E5E7EB] h-1.5 rounded-full overflow-hidden">
                        <div className="bg-[#D97706] h-full" style={{ width: '88%' }}></div>
                      </div>
                    </div>
                    <div>
                      <div className="flex justify-between text-[12px] mb-1">
                        <span className="font-medium text-[#111827]">Sec B // East Pavilion</span>
                        <span className="text-[#6B7280] font-medium tabular-nums">74%</span>
                      </div>
                      <div className="w-full bg-[#E5E7EB] h-1.5 rounded-full overflow-hidden">
                        <div className="bg-[#6B7280] h-full" style={{ width: '74%' }}></div>
                      </div>
                    </div>
                    <div>
                      <div className="flex justify-between text-[12px] mb-1">
                        <span className="font-medium text-[#111827]">Sec C // Perimeter Gates</span>
                        <span className="text-[#DC2626] font-medium tabular-nums">94%</span>
                      </div>
                      <div className="w-full bg-[#E5E7EB] h-1.5 rounded-full overflow-hidden">
                        <div className="bg-[#DC2626] h-full" style={{ width: '94%' }}></div>
                      </div>
                    </div>
                    <div>
                      <div className="flex justify-between text-[12px] mb-1">
                        <span className="font-medium text-[#111827]">Sec D // Food & Retail</span>
                        <span className="text-[#6B7280] font-medium tabular-nums">58%</span>
                      </div>
                      <div className="w-full bg-[#E5E7EB] h-1.5 rounded-full overflow-hidden">
                        <div className="bg-[#9CA3AF] h-full" style={{ width: '58%' }}></div>
                      </div>
                    </div>
                  </div>
                  <div className="mt-4 pt-3 border-t border-[#E5E7EB] flex items-center justify-between text-[12px]">
                    <span className="text-[#6B7280] tabular-nums">Aggregate: 48,290 pax</span>
                    <span className="text-[#DC2626] font-medium text-[11px] inline-flex items-center gap-1">
                      <span className="w-1.5 h-1.5 rounded-full bg-[#DC2626]"></span> Peak Active
                    </span>
                  </div>
                </div>

                {/* Verified Actions Stream */}
                <div className="bg-[#F9FAFB] border border-[#E5E7EB] rounded-lg p-4">
                  <div className="flex items-center justify-between pb-2 border-b border-[#E5E7EB] mb-3">
                    <span className="text-[13px] font-semibold text-[#111827]">Recent Verified Actions</span>
                    <span className="material-symbols-outlined text-[16px] text-[#6B7280]">history</span>
                  </div>
                  <div className="flex flex-col gap-2">
                    {recentLog.map((log, idx) => (
                      <div key={idx} className="p-2.5 bg-white rounded-lg border border-[#E5E7EB]">
                        <div className="flex justify-between text-[12px] font-medium text-[#111827]">
                          <span>{log.title}</span>
                          <span className="text-[#6B7280] font-normal tabular-nums">{log.time}</span>
                        </div>
                        <p className="text-[#6B7280] text-[11px] mt-0.5">{log.desc}</p>
                      </div>
                    ))}
                  </div>
                </div>

                <div className="p-3 bg-[#F9FAFB] rounded-lg border border-[#E5E7EB] text-[12px] text-[#6B7280]">
                  <div className="flex items-center gap-1.5 font-medium text-[#111827] mb-1">
                    <span className="material-symbols-outlined text-[14px] text-[#6B7280]">lock</span>
                    <span>Audit Enforcement</span>
                  </div>
                  All intervention triggers generate an immutable cryptographically hashed audit entry tied to your duty badge credentials.
                </div>
              </div>
            </div>

            {/* Modal */}
            {actionModal.open && (
              <div className="fixed inset-0 bg-[#111827]/40 z-[100] flex items-center justify-center p-4">
                <div className="bg-white border border-[#E5E7EB] rounded-lg max-w-lg w-full p-6 relative">
                  <div className="flex justify-between items-start pb-4 border-b border-[#E5E7EB] mb-4">
                    <div>
                      <span className="px-2 py-0.5 bg-[#EFF6FF] text-[#2563EB] rounded text-[11px] font-medium">Log Entry Recording</span>
                      <h3 className="text-[18px] font-semibold text-[#111827] mt-1">Confirm Dispatch Execution</h3>
                    </div>
                    <button onClick={() => setActionModal({ open: false, title: '', cardId: null, operator: '' })} className="w-8 h-8 rounded border border-[#E5E7EB] text-[#6B7280] hover:bg-[#F3F4F6] flex items-center justify-center transition-colors">
                      ✕
                    </button>
                  </div>
                  <div className="space-y-4 text-[13px]">
                    <div className="p-3 bg-[#F9FAFB] rounded-lg border border-[#E5E7EB]">
                      <div className="text-[11px] text-[#6B7280] uppercase tracking-wider font-medium">Action Order:</div>
                      <div className="text-[14px] font-semibold text-[#111827] mt-0.5">{actionModal.title}</div>
                    </div>
                    <div className="grid grid-cols-2 gap-3">
                      <div className="p-3 bg-[#F9FAFB] rounded-lg border border-[#E5E7EB]">
                        <span className="text-[11px] text-[#6B7280] block">Duty Officer</span>
                        <span className="font-medium text-[#111827] mt-0.5 block">{actionModal.operator}</span>
                      </div>
                      <div className="p-3 bg-[#F9FAFB] rounded-lg border border-[#E5E7EB]">
                        <span className="text-[11px] text-[#6B7280] block">Timestamp</span>
                        <span className="font-medium text-[#111827] mt-0.5 block tabular-nums">21:42:18 CEST</span>
                      </div>
                    </div>
                    <div className="p-3 bg-[#F9FAFB] rounded-lg border border-[#E5E7EB] text-[12px] text-[#6B7280]">
                      <span className="font-medium text-[#111827] block mb-0.5">Radio Verification Directive:</span>
                      Tactical channel notification will broadcast automatically. Physical field units are bound by protocol to confirm on-station arrival within 180 seconds.
                    </div>
                    <div className="flex items-center gap-3 pt-2">
                      <button 
                        onClick={handleConfirmAction}
                        className="w-full py-2.5 bg-[#2563EB] text-white font-medium rounded-lg text-[13px] hover:bg-[#1D4ED8] transition-colors"
                      >
                        Authorize & Broadcast Order
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            )}
          </div>
        </main>
      );
    };

    // Main App with MemoryRouter
    const App = () => {
      const [audioOn, setAudioOn] = useState(true);
      const [activeSector, setActiveSector] = useState('ALL');
      const [toast, setToast] = useState({ visible: false, title: '', msg: '' });

      const showToast = (title, msg) => {
        setToast({ visible: true, title, msg });
        setTimeout(() => {
          setToast(prev => ({ ...prev, visible: false }));
        }, 4000);
      };

      return (
        <div className="min-h-screen flex flex-col bg-[#F9FAFB] text-[#111827]">
          <Header 
            audioOn={audioOn} 
            setAudioOn={setAudioOn} 
            activeSector={activeSector} 
            setActiveSector={setActiveSector} 
          />

          <div className="flex-1 flex flex-col">
            <Routes>
              <Route path="/" element={<LiveCrowdMapScreen onShowToast={showToast} />} />
              <Route path="/live-crowd-map" element={<LiveCrowdMapScreen onShowToast={showToast} />} />
              <Route path="/alerts" element={<AlertsActionsScreen onShowToast={showToast} />} />
              <Route path="/alerts-actions" element={<AlertsActionsScreen onShowToast={showToast} />} />
              <Route path="/decisions" element={<DecisionLogScreen onShowToast={showToast} />} />
              <Route path="/decision-log" element={<DecisionLogScreen onShowToast={showToast} />} />
            </Routes>
          </div>

          <Footer />
          <Toast toast={toast} onClose={() => setToast(prev => ({ ...prev, visible: false }))} />
        </div>
      );
    };

    const rootElement = document.getElementById('root');
    const root = createRoot(rootElement);
    root.render(
      <MemoryRouter initialEntries={['/']}>
        <App />
      </MemoryRouter>
    );
  </script>
</body>
</html>
