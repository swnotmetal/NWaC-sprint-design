      darkMode: "class",
      theme: {
        extend: {

            sans: ['Inter', 'sans-serif'],

              DEFAULT: '#2563eb',

  <style>
    body {
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      background-color: #F9FAFB;
      color: #111827;
    }
    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }
    *, ::before, ::after {
      box-shadow: none !important;
      text-shadow: none !important;
    }
    ::-webkit-scrollbar {
      display: none;
    }
    /* Unidirectional scrolling ticker */
    @keyframes marquee {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
    .marquee-track {
      display: flex;
      width: max-content;
      animation: marquee 24s linear infinite;
    }
    /* Critical-cell heartbeat: double-thump once per 3s cycle */
    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      22% { transform: scale(1.09); }
      34% { transform: scale(1); }
      46% { transform: scale(1.05); }
      58% { transform: scale(1); }
    }
    .heartbeat-cell {
      animation: heartbeat 3s ease-in-out infinite;
      position: relative;
      z-index: 20;
    }
    /* Hallmark: no horizontal scroll on any viewport */
    html, body { overflow-x: clip; }
    /* Hallmark: always-visible keyboard focus ring */
    :focus-visible {
      outline: 2px solid #2563EB;
      outline-offset: 2px;
    }
    /* Hallmark: interactive grid cells show an affordance */
    .grid-cell:hover { border-color: #2563EB; }
    /* Hallmark: reduced-motion users get a static, readable view */
    @media (prefers-reduced-motion: reduce) {
      .marquee-track { animation: none; width: auto; }
      .marquee-dup { display: none; }
      .heartbeat-cell { animation: none; }
    }
  </style>

          tag: 'ZONE D2',
          status: 'Heavy Footfall',
          isWarning: false,
          predDensity: '78%',
          timeToChoke: 'Queue Stacking',
          chokeFactor: '3.2 ppl/m²',
          risk: 'Severity 2 (Moderate)',
          driver: 'Queue buildup at vendors',
          factors: {
            arrivals: '18 Food Trucks Operational',
            velocity: '140 ppl/min dwell',
            downstream: 'Water queue: 10m'
          }
        },
        'B6': {
          name: 'Entry B (VIP & East)',
          tag: 'ZONE B6',
          status: 'Optimal',
          isWarning: false,
          predDensity: '62%',
          timeToChoke: 'Clear',
          chokeFactor: '1.9 ppl/m²',
          risk: 'Severity 1 (Optimal)',
          driver: 'Steady entry flow',
          factors: {
            arrivals: 'VIP entry flow',
            velocity: '64 ppl/min',
            downstream: 'Upper Terrace Fluid'
          }
        }
      };

      const baseZone = zoneDatabase[selectedZone] || {
        name: `Oracle Sector ${selectedZone}`,
        tag: `ZONE ${selectedZone}`,
        status: 'Monitoring',
        chokeFactor: '2.4 ppl/m²',
        risk: 'Severity 1 (Normal)',
        driver: 'Nominal inflow',
        factors: {
          arrivals: 'Nominal Inflow',
          velocity: '110 ppl/min',
          downstream: 'Clear egress'
        }
      };

      // Horizon-aware overlay: predicted density and choke ETA come from the
      // forecast model, so the inspector shifts as the operator scrubs time.
      // Cells without a density reading (e.g. medical/triage) keep their base text.
      const rawZoneDensity = HORIZON_DENSITY[horizon][selectedZone];
      const zoneMetric = HORIZON_METRIC[horizon][selectedZone] || '';
      // Distinguish flow (ppl/min) from density (ppl/m²): C3's metric is a
      // density reading and must drive Choke Factor, never Velocity.
      const isFlowMetric = zoneMetric.includes('ppl/min');
      // QoD triggers on the raw forecast; a dispatched response re-projects the
      // risk down without un-triggering the network reservation.
      const overThreshold = rawZoneDensity != null && rawZoneDensity >= 90;
      // Site-wide check: does any sector cross the QoD trigger threshold this horizon?
      const overSectors = GRID_CELLS.filter(cell => {
        const d = HORIZON_DENSITY[horizon][cell.id];
        return d != null && d >= 90;
      });
      const anyOverThreshold = overSectors.length > 0;
      const responded = dispatchedZones[selectedZone];
      const zoneDensity = responded ? Math.max(0, rawZoneDensity - 12) : rawZoneDensity;
      const currentZone = {
        ...baseZone,
        predDensity: zoneDensity != null ? `${zoneDensity}%` : baseZone.predDensity,
        timeToChoke: responded ? 'Response active' : (overThreshold ? (horizon === 'now' ? 'Active Capacity' : `ETA: +${horizon} min`) : (zoneDensity != null ? 'Nominal' : baseZone.timeToChoke)),
        isWarning: responded ? false : (zoneDensity != null && zoneDensity >= 75),
        status: responded ? 'Responding' : (overThreshold ? 'Critical' : (zoneDensity != null && zoneDensity >= 75 ? 'Warning' : baseZone.status)),
        chokeFactor: isFlowMetric ? baseZone.chokeFactor : (zoneMetric || baseZone.chokeFactor),
        factors: {
          ...baseZone.factors,
          velocity: isFlowMetric ? `${zoneMetric} (inflow)` : baseZone.factors.velocity
        }
      };

      return (
        <div className="flex-1 flex flex-col">
          {/* Sub-Toolbar */}
          <div className="bg-white border-b border-[#E5E7EB]">
            <div className="max-w-[1720px] mx-auto px-4 sm:px-6 py-3 flex flex-wrap items-center justify-between gap-4">
              {/* Horizon Selector */}
              <div className="flex items-center gap-3">
                <span className="text-[12px] text-[#6B7280] font-medium">Temporal Horizon:</span>
                <div className="inline-flex max-w-full overflow-x-auto bg-[#F9FAFB] border border-[#E5E7EB] rounded-lg p-0.5">
                  {[
                    { id: 'now', label: 'Now', time: '[21:42]' },
                    { id: '30', label: '+30 min', time: '[22:12]' },
                    { id: '60', label: '+60 min', time: '[22:42]' },
                    { id: '90', label: '+90 min', time: '[23:12]' }
                  ].map(tab => (
                    <button
                      key={tab.id}
                      onClick={() => { setHorizon(tab.id); setPlaying(false); }}
                      className={`px-3 py-1 rounded-[6px] text-[13px] font-medium transition-colors ${
                        horizon === tab.id 
                          ? 'bg-[#2563EB] text-white' 
                          : 'text-[#6B7280] hover:text-[#111827]'
                      }`}
                    >
                      {tab.label} <span className="text-[11px] tabular-nums opacity-80">{tab.time}</span>
                    </button>
                  ))}
                </div>
                <button
                  onClick={() => setPlaying(p => !p)}
                  className={`inline-flex items-center gap-1.5 px-3 py-1 rounded-[6px] text-[13px] font-medium transition-colors ${playing ? 'bg-[#111827] text-white' : 'bg-[#2563EB] text-white hover:bg-[#1D4ED8]'}`}
                  aria-label={playing ? 'Pause forecast playback' : 'Play forecast timeline'}
                >
                  <span className="material-symbols-outlined text-[16px]">{playing ? 'pause' : 'play_arrow'}</span>
                  {playing ? 'Pause' : 'Play forecast'}
                </button>
                <span className="text-[12px] text-[#6B7280] hidden lg:inline tabular-nums">
                  Confidence: <span className="font-medium text-[#111827]">{HORIZON_CONFIDENCE[horizon]}</span>
                </span>
              </div>
            </div>
          </div>

          {/* Calm Forecast Banner */}
          {horizon !== 'now' && (
            <div className="bg-[#EFF6FF] border-b border-[#DBEAFE] overflow-hidden">
              <div className="marquee-track py-2">
                {[0, 1].map(i => (
                  <div key={i} className={`flex items-center whitespace-nowrap pr-10 text-[13px]${i === 1 ? ' marquee-dup' : ''}`}>
                    <span className="text-[#2563EB] font-semibold tracking-wide mr-3">[Skylark-AI]</span>
                    <span className="w-2 h-2 rounded-full bg-[#DC2626] shrink-0 mr-2.5"></span>
                    <span className="font-medium text-[#1E3A8A]">{HORIZON_BANNER[horizon].title}</span>
                    <span className="text-[#475569] text-[12px] ml-3">{HORIZON_BANNER[horizon].detail}</span>
                    <span className="text-[#1E3A8A] font-medium tabular-nums ml-6">· {HORIZON_BANNER[horizon].eta}</span>
                    <span className="text-[#6B7280] text-[12px] ml-6">— I'll be back... with 100Gbps bandwidth.</span>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* Main Layout Surface */}
          <main className="max-w-[1720px] mx-auto w-full p-4 sm:p-6 flex-1 flex flex-col">
            <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 flex-1 items-start">
              {/* Map Canvas (8 of 12 cols = ~66%) */}
              <div className="lg:col-span-8 flex flex-col gap-4">
                <div className="bg-white border border-[#E5E7EB] rounded-lg p-4 sm:p-5 flex flex-col">
                  {/* Matrix Header & Legend */}
                  <div className="flex flex-wrap items-center justify-between pb-4 mb-4 border-b border-[#E5E7EB] gap-3">
                    <div className="flex items-center gap-3">
                      <h1 className="text-[20px] font-semibold text-[#111827]">Oracle Grid Sector A1–E6</h1>
                      <span className="text-[12px] text-[#6B7280]">50m Cellular Aggregation</span>
                    </div>
                    <div className="flex items-center gap-4 text-[12px] text-[#6B7280]">
                      <span className="text-[11px] font-medium uppercase tracking-wider text-[#9CA3AF]">Density:</span>
                      <div className="flex items-center gap-1.5">
                        <span className="w-3 h-3 rounded-[3px] bg-[#E9F3EB] border border-[#CDE2D2]"></span>
                        <span>&lt;50%</span>
                      </div>
                      <div className="flex items-center gap-1.5">
                        <span className="w-3 h-3 rounded-[3px] bg-[#FBF3D3] border border-[#E9DFA8]"></span>
                        <span>50–75%</span>
                      </div>
                      <div className="flex items-center gap-1.5">
                        <span className="w-3 h-3 rounded-[3px] bg-[#FBE7CE] border border-[#EFCDA3]"></span>
                        <span>75–90%</span>
                      </div>
                      <div className="flex items-center gap-1.5">
                        <span className="w-3 h-3 rounded-[3px] bg-[#F9DCDB] border border-[#EAC2C0]"></span>
                        <span className="font-medium text-[#111827]">&gt;90% (High)</span>
                      </div>
                      <div className="flex items-center gap-1.5 ml-2">
                        <span className="w-1.5 h-1.5 rounded-full bg-[#DC2626]"></span>
                        <span>active alert</span>
                      </div>
                    </div>
                  </div>

                  {/* Network Response — the Network-as-Code moment */}
                  <div className={`rounded-lg border px-4 py-3 mb-4 transition-colors ${anyOverThreshold ? 'border-[#F59E0B] bg-[#FFFBEB]' : 'border-[#E5E7EB] bg-[#F9FAFB]'}`}>
                    <div className="flex flex-wrap items-center justify-between gap-3">
                      <div className="flex items-center gap-3">
                        <span className="relative flex h-3 w-3 shrink-0">
                          {anyOverThreshold && <span className="absolute inline-flex h-full w-full animate-ping rounded-full bg-[#F59E0B] opacity-60"></span>}
                          <span className={`relative inline-flex h-3 w-3 rounded-full ${anyOverThreshold ? 'bg-[#F59E0B]' : 'bg-[#059669]'}`}></span>
                        </span>
                        <div>
                          <div className={`text-[14px] font-semibold ${anyOverThreshold ? 'text-[#B45309]' : 'text-[#111827]'}`}>
                            Network QoD {anyOverThreshold ? 'ENGAGED' : 'Standby'}
                            <span className="text-[11px] font-normal text-[#6B7280] ml-2">via Nokia Network as Code</span>
                          </div>
                          <div className={`text-[12px] mt-0.5 ${anyOverThreshold ? 'text-[#B45309]' : 'text-[#6B7280]'}`}>
                            {anyOverThreshold
                              ? <span>{overSectors.length} sector{overSectors.length === 1 ? '' : 's'} over 90% · 100Gbps · 15ms slice · covering {overSectors.map(s => s.id).join(' · ')}</span>
                              : 'Auto-engages the moment predicted density crosses 90%'}
                          </div>
                        </div>
                      </div>
                      <span className={`inline-flex items-center gap-1.5 text-[12px] font-semibold tabular-nums ${anyOverThreshold ? 'text-[#D97706]' : 'text-[#059669]'}`}>
                        <span className="material-symbols-outlined text-[16px]">cell_tower</span>
                        {anyOverThreshold ? 'LIVE' : 'ARMED'}
                      </span>
                    </div>
                  </div>

                  {/* Telemetry Strip */}
                  <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-4">
                    <div className="bg-[#F9FAFB] border border-[#E5E7EB] rounded-lg p-3">
                      <div className="text-[12px] text-[#6B7280]">Active On-Site</div>
                      <div className="text-[18px] font-semibold text-[#111827] tabular-nums mt-0.5">{HORIZON_KPI[horizon].inVenue} <span className="text-[12px] text-[#6B7280] font-normal">/ 52,000</span></div>
                    </div>
                    <div className="bg-[#F9FAFB] border border-[#E5E7EB] rounded-lg p-3">
                      <div className="text-[12px] text-[#6B7280]">Capacity Utilized</div>
                      <div className="text-[18px] font-semibold text-[#111827] tabular-nums mt-0.5">{HORIZON_KPI[horizon].capacity}</div>
                    </div>
                    <div className="bg-[#F9FAFB] border border-[#E5E7EB] rounded-lg p-3">
                      <div className="text-[12px] text-[#6B7280]">Net Inflow Rate</div>
                      <div className="text-[18px] font-semibold text-[#2563EB] tabular-nums mt-0.5">{HORIZON_KPI[horizon].inflow} <span className="text-[12px] font-normal text-[#6B7280]">ppl/min</span></div>
                    </div>
                    <div className="bg-[#F9FAFB] border border-[#E5E7EB] rounded-lg p-3">
                      <div className="text-[12px] text-[#6B7280]">Average Flow Speed</div>
                      <div className="text-[18px] font-semibold text-[#111827] tabular-nums mt-0.5">{HORIZON_KPI[horizon].speed} <span className="text-[12px] font-normal text-[#6B7280]">m/s</span></div>
                    </div>
                  </div>

                  {/* Interactive Cell Grid */}
                  <div className="relative w-full rounded-lg border border-[#E5E7EB] bg-[#F9FAFB] overflow-hidden p-1.5 sm:p-2">
                    <div className="hidden sm:grid grid-cols-6 gap-2 mb-2 text-center text-[11px] font-medium text-[#6B7280]">
                      <div>COL 1</div><div>COL 2</div><div>COL 3</div><div>COL 4</div><div>COL 5</div><div>COL 6</div>
                    </div>

                    <div className="grid grid-cols-6 grid-rows-5 gap-1 sm:gap-2 relative z-10 text-[12px]">
                      {GRID_CELLS.map((cell) => {
                        const rawDensity = HORIZON_DENSITY[horizon][cell.id] || 0;
                        const respondedCell = dispatchedZones[cell.id];
                        const density = respondedCell ? Math.max(0, rawDensity - 12) : rawDensity;
                        const hasAlert = Object.values(ALERT_ZONES).includes(cell.id);
                        const toneKey = densityTone(density);
                        const tone = TONE_CLASSES[toneKey];
                        const selected = selectedZone === cell.id;
                        const rich = cell.metric || cell.note || cell.icon;
                        const nameCls = rich ? tone.nameRich : tone.name;
                        const metric = cell.metric ? HORIZON_METRIC[horizon][cell.id] : null;
                        const heartbeat = heartbeatOn && rawDensity > 95;
                        const ringCls = selected ? 'ring-2 ring-[#2563EB]' : '';

                        if (cell.triage) {
                          return (
                            <div key={cell.id} tabIndex={0} role="button" aria-pressed={selected} onClick={() => setSelectedZone(cell.id)} onKeyDown={(e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setSelectedZone(cell.id); } }} className={`grid-cell cursor-pointer p-2 sm:p-2.5 rounded-lg border flex flex-col justify-between h-20 sm:h-24 transition-colors ${ringCls} bg-white border-[#E5E7EB]`}>
                              <div className="flex justify-between items-start"><span className="text-[11px] font-semibold text-[#111827]">{cell.id}</span><span className="text-[11px] text-[#059669] font-medium">Triage</span></div>
                              <div><div className="text-[12px] font-medium text-[#111827]">{cell.name}</div><div className="text-[11px] text-[#6B7280]">4 treatment bays ready</div></div>
                            </div>
                          );
                        }

                        return (
                          <div key={cell.id} tabIndex={0} role="button" aria-pressed={selected} onClick={() => setSelectedZone(cell.id)} onKeyDown={(e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setSelectedZone(cell.id); } }} className={`grid-cell cursor-pointer p-2 sm:p-2.5 rounded-lg border flex flex-col justify-between h-20 sm:h-24 transition-colors ${ringCls} ${tone.box}${heartbeat ? ' heartbeat-cell' : ''}`}>
                            <div className="flex justify-between items-start">
                              <span className={`text-[11px] font-semibold ${tone.id} flex items-center gap-1`}>
                                {cell.id}
                                {hasAlert && <span className="w-1.5 h-1.5 rounded-full bg-[#DC2626]"></span>}
                                {respondedCell && <span className="material-symbols-outlined text-[12px] text-[#059669]">check_circle</span>}
                              </span>
                              {toneKey === 'high' || toneKey === 'critical' ? (
                                <span className={`px-1.5 py-0.5 rounded ${tone.pill} text-[11px] tabular-nums`}>{density}%{respondedCell ? ' ↓' : ''}</span>
                              ) : (
                                <span className={`tabular-nums ${tone.pct}`}>{density}%{respondedCell ? ' ↓' : ''}</span>
                              )}
                            </div>
                            <div>
                              <div className={`${nameCls}${cell.icon ? ' flex items-center gap-1' : ''} truncate`}>
                                {cell.icon && <span className="material-symbols-outlined text-[14px]">{cell.icon}</span>}
                                {cell.name}
                              </div>
                              {metric && <div className={`text-[11px] ${tone.metric} tabular-nums`}>{metric}</div>}
                              {cell.note && <div className={`text-[11px] ${tone.metric}`}>{cell.note}</div>}
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>

                  {/* GDPR strip */}
                  <div className="mt-4 p-3 bg-[#F9FAFB] border border-[#E5E7EB] rounded-lg flex flex-col sm:flex-row sm:items-center justify-between gap-2 text-[12px] text-[#6B7280]">
                    <div className="flex items-center gap-2">
                      <span className="material-symbols-outlined text-[16px] text-[#2563EB]">privacy_tip</span>
                      <span><strong>Anonymized Mobile Aggregation · Nokia Network as Code (CAMARA Device Status):</strong> Zero PII stored or tracked. Spatial radius: 50m IMSI hash cells.</span>
                    </div>
                    <div className="flex items-center gap-3">
                      <span className="text-[#059669] font-medium">GDPR Article 89 Compliant</span>
                      <span className="text-[#9CA3AF]">·</span>
                      <span className="tabular-nums">Latency: 420ms</span>
                    </div>
                  </div>
                </div>
              </div>

              {/* Inspector Sidebar (4 of 12 cols = ~34%) */}
              <aside className="lg:col-span-4 flex flex-col gap-4">
                <div className="bg-white border border-[#E5E7EB] rounded-lg p-5 flex flex-col gap-5">
                  <div className="flex flex-col gap-4">
                    <div className="flex items-start justify-between">
                      <div>
                        <div className="flex items-center gap-2 mb-1">
                          <span className="px-2 py-0.5 rounded bg-[#2563EB] text-white text-[11px] font-semibold">{currentZone.tag}</span>
                          <span className={`inline-flex items-center gap-1 text-[12px] ${currentZone.isWarning ? 'text-[#DC2626]' : 'text-[#059669]'} font-medium`}>
                            <span className={`w-1.5 h-1.5 rounded-full ${currentZone.isWarning ? 'bg-[#DC2626]' : 'bg-[#059669]'}`}></span> {currentZone.status}
                          </span>
                        </div>
                        <h2 className="text-[20px] font-semibold text-[#111827]">{currentZone.name}</h2>
                        <p className="text-[12px] text-[#6B7280]">Telemetry Node Inspection</p>
                      </div>
                      <button 
                        onClick={() => onShowToast('Centered View', `Focus locked onto Sector ${selectedZone}`)}
                        className="p-1.5 rounded border border-[#E5E7EB] text-[#6B7280] hover:text-[#111827] hover:bg-[#F9FAFB]" 
                        title="Focus Zone"
                      >
                        <span className="material-symbols-outlined text-[18px]">filter_center_focus</span>
                      </button>
                    </div>

                    {/* Forecast driver — why this zone is projected to rise */}
                    {currentZone.isWarning && (
                      <div className="flex items-center gap-2 text-[11px] text-[#6B7280]">
                        <span className="material-symbols-outlined text-[14px] text-[#2563EB]">insights</span>
                        <span>
                          <span className="font-medium text-[#111827]">Forecast driver:</span>{' '}
                          {currentZone.driver}.
                        </span>
                      </div>
                    )}

                    {/* Response status */}
                    {responded ? (
                      <div className="flex items-center gap-2.5 px-3 py-2.5 rounded-lg border border-[#D1FAE5] bg-[#ECFDF5]">
                        <span className="material-symbols-outlined text-[18px] text-[#059669]">check_circle</span>
                        <div className="flex-1">
                          <div className="text-[12px] font-semibold text-[#047857]">
                            {dispatchedZones[selectedZone] === 'advisory' ? 'Advisory broadcast' : 'Steward team dispatched'}
                          </div>
                          <p className="text-[11px] leading-snug mt-0.5 text-[#047857]">
                            Projected density re-scored to {zoneDensity}% (from {rawZoneDensity}%).
                          </p>
                        </div>
                      </div>
                    ) : overThreshold ? (
                      <div className="flex items-center gap-2.5 px-3 py-2.5 rounded-lg border border-[#F59E0B] bg-[#FFFBEB]">
                        <span className="material-symbols-outlined text-[18px] text-[#D97706]">warning</span>
                        <p className="text-[12px] text-[#B45309]">Above safe limit — action recommended.</p>
                      </div>
                    ) : null}

                    <div className="grid grid-cols-2 gap-3">
                      <div className="bg-[#F9FAFB] border border-[#E5E7EB] rounded-lg p-3">
                        <div className="text-[12px] text-[#6B7280]">Predicted Density</div>
                        <div className="text-[20px] font-semibold text-[#111827] tabular-nums mt-0.5">{currentZone.predDensity}</div>
                        <div className={`text-[11px] ${currentZone.isWarning ? 'text-[#DC2626]' : 'text-[#6B7280]'} font-medium mt-0.5`}>
                          {currentZone.timeToChoke}
                        </div>
                      </div>
                      <div className="bg-[#F9FAFB] border border-[#E5E7EB] rounded-lg p-3">
                        <div className="text-[12px] text-[#6B7280]">Choke Factor</div>
                        <div className="text-[20px] font-semibold text-[#111827] tabular-nums mt-0.5">
                          {currentZone.chokeFactor}
                        </div>
                        <div className="text-[11px] text-[#6B7280] mt-0.5">Threshold: 4.0</div>
                      </div>
                    </div>

                    <div className="bg-[#F9FAFB] border border-[#E5E7EB] rounded-lg p-3 space-y-2 text-[12px]">
                      <div className="font-medium text-[#111827]">Telemetric Breakdown</div>
                      <div className="flex justify-between text-[#6B7280]">
                        <span>Arrivals:</span>
                        <span className="font-medium text-[#111827] tabular-nums">{currentZone.factors.arrivals}</span>
                      </div>
                      <div className="flex justify-between text-[#6B7280]">
                        <span>Velocity:</span>
                        <span className="font-medium text-[#111827] tabular-nums">{currentZone.factors.velocity}</span>
                      </div>
                      <div className="flex justify-between text-[#6B7280]">
                        <span>Downstream:</span>
                        <span className="font-medium text-[#111827]">{currentZone.factors.downstream}</span>
                      </div>
                      <div className="flex justify-between items-center text-[#6B7280] pt-1 border-t border-[#E5E7EB]">
                        <span>Risk Level:</span>
                        <span className="inline-flex items-center gap-1 px-2 py-0.5 rounded bg-[#EFF6FF] text-[#1E40AF] font-medium text-[11px]">
                          {currentZone.risk}
                        </span>
                      </div>
                    </div>

                    <div className="flex flex-col gap-2 pt-1">
                      <button 
                        onClick={() => {
                          setDispatchedZones(prev => ({ ...prev, [selectedZone]: 'stewards' }));
                          onShowToast('Units Dispatched', `Steward squad assigned to Sector ${selectedZone}`);
                        }}
                        className="w-full py-2.5 px-4 rounded-lg bg-[#2563EB] hover:bg-[#1D4ED8] text-white text-[13px] font-medium flex items-center justify-center gap-2 transition-colors"
                      >
                        <span className="material-symbols-outlined text-[18px]">groups</span>
                        Dispatch Steward Team to {selectedZone}
                      </button>
                      <button 
                        onClick={() => {
                          setDispatchedZones(prev => ({ ...prev, [selectedZone]: 'advisory' }));
                          onShowToast('Advisory Broadcast', `Avoid-area notice sent near Sector ${selectedZone}`);
                        }}
                        className="w-full py-2 px-4 rounded-lg bg-white border border-[#E5E7EB] hover:bg-[#F9FAFB] text-[#111827] text-[13px] font-medium flex items-center justify-center gap-2 transition-colors"
                      >
                        <span className="material-symbols-outlined text-[18px] text-[#6B7280]">campaign</span>
                        Broadcast Avoid-Area Advisory
                      </button>
                    </div>
                  </div>
                </div>
              </aside>
            </div>

            {/* Page explanation */}
            <p className="mt-6 text-center text-[11px] text-[#9CA3AF] leading-relaxed">
              Each 50 m cell shows live footfall — darker means busier. Drag the timeline to preview the next 90 minutes.
            </p>
          </main>
        </div>
      );
    };

    // ==========================================
    // SCREEN 3: ALERTS & ACTIONS COMPONENT
    // ==========================================
    const AlertsActionsScreen = ({ onShowToast }) => {
      const navigate = useNavigate();
      const [actionModal, setActionModal] = useState({ open: false, title: '', cardId: null, operator: 'Commander R. Vance' });
      const [dispatchedCards, setDispatchedCards] = useState({});

      const openConfirmModal = (title, cardId) => {
        setActionModal({ open: true, title, cardId, operator: 'Commander R. Vance' });
      };

      const handleConfirmAction = () => {
        setDispatchedCards(prev => ({ ...prev, [actionModal.cardId]: true }));
        setActionModal({ open: false, title: '', cardId: null, operator: '' });
        onShowToast('Directive Broadcast', `Logged & transmitted: ${actionModal.title}`);
      };

      return (
        <main className="w-full flex-1 bg-white">
          <div className="max-w-[1600px] mx-auto px-4 sm:px-6 py-5 flex flex-col gap-6">
            {/* Header */}
            <div className="pb-2 border-b border-[#E5E7EB]">
              <h1 className="text-[20px] font-semibold text-[#111827] leading-tight">Alerts &amp; Actions</h1>
              <p className="text-xs text-[#6B7280] mt-1">Predicted crowding risks, with a recommended action for each.</p>
            </div>

            {/* Alert feed */}
            <div className="flex flex-col gap-5">
                {/* Alert 1 */}
                {(
                  <article className={`bg-[#F9FAFB] border border-[#E5E7EB] rounded-lg overflow-hidden transition-all ${
                    dispatchedCards['c1'] ? 'opacity-60' : ''
                  }`}>
                    <div className="p-4 border-b border-[#E5E7EB] flex flex-wrap items-center justify-between gap-3 bg-white">
                      <div className="flex items-center gap-3">
                        <span className="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[12px] font-medium bg-[#FEF2F2] text-[#DC2626] border border-[#FEE2E2]">
                          <span className="w-1.5 h-1.5 rounded-full bg-[#DC2626]"></span> Priority 1 · Critical
                        </span>
                        <h2 className="text-[16px] font-semibold text-[#111827]">Critical Density Surge — Entry C Perimeter</h2>
                      </div>
                      <div className="flex items-center gap-2">
                        <span className="px-2.5 py-0.5 rounded-lg bg-[#F3F4F6] text-[#111827] font-medium text-[12px] border border-[#E5E7EB] tabular-nums">
                          T-minus 12 mins
                        </span>
                        <span className="text-[12px] text-[#6B7280] tabular-nums">EV-9021</span>
                      </div>
                    </div>
                    <div className="p-5 flex flex-col gap-4">
                      <div className="flex flex-wrap items-baseline gap-3">
                        <span className="text-[24px] font-semibold text-[#DC2626] tabular-nums">104%</span>
                        <span className="text-[12px] text-[#6B7280]">projected density in 12 min · safe max 4.0 ppl/m²</span>
                      </div>
                      <div className="p-3.5 bg-white rounded-lg border border-[#E5E7EB] flex items-start gap-3">
                        <span className="material-symbols-outlined text-[18px] text-[#2563EB] mt-0.5">info</span>
                        <p className="text-[14px] text-[#111827]">
                          Deploy 4 additional staff to the Entry C outer barrier; redirect incoming pedestrian flow to the Entry B bypass route.
                        </p>
                      </div>
                      <div className="pt-1 flex flex-wrap items-center gap-3">
                        <button 
                          disabled={dispatchedCards['c1']}
                          onClick={() => openConfirmModal('Entry C Tactical Reinforcement', 'c1')}
                          className={`px-4 py-2 rounded-lg text-[13px] font-medium transition-colors inline-flex items-center gap-1.5 ${
                            dispatchedCards['c1'] 
                              ? 'bg-gray-200 text-[#6B7280] cursor-not-allowed' 
                              : 'bg-[#2563EB] hover:bg-[#1D4ED8] text-white'
                          }`}
                        >
                          <span className="material-symbols-outlined text-[16px]">check_circle</span>
                          {dispatchedCards['c1'] ? 'Dispatched' : 'Confirm Dispatch'}
                        </button>
                        <button 
                          onClick={() => navigate('/', { state: { focusZone: ALERT_ZONES['c1'] } })}
                          className="text-[13px] font-medium text-[#2563EB] hover:underline inline-flex items-center gap-1"
                        >
                          View on map
                          <span className="material-symbols-outlined text-[14px]">arrow_forward</span>
                        </button>
                      </div>
                    </div>
                  </article>
                )}

                {/* Alert 2 */}
                {(
                  <article className={`bg-[#F9FAFB] border border-[#E5E7EB] rounded-lg overflow-hidden transition-all ${
                    dispatchedCards['c2'] ? 'opacity-60' : ''
                  }`}>
                    <div className="p-4 border-b border-[#E5E7EB] flex flex-wrap items-center justify-between gap-3 bg-white">
                      <div className="flex items-center gap-3">
                        <span className="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[12px] font-medium bg-[#FFFBEB] text-[#D97706] border border-[#FEF3C7]">
                          <span className="w-1.5 h-1.5 rounded-full bg-[#D97706]"></span> Priority 2 · Warning
                        </span>
                        <h2 className="text-[16px] font-semibold text-[#111827]">Central Plaza Crowd Compression</h2>
                      </div>
                      <div className="flex items-center gap-2">
                        <span className="px-2.5 py-0.5 rounded-lg bg-[#F3F4F6] text-[#111827] font-medium text-[12px] border border-[#E5E7EB] tabular-nums">
                          T-horizon: 26 min
                        </span>
                        <span className="text-[12px] text-[#6B7280] tabular-nums">Forecast: 92%</span>
                      </div>
                    </div>
                    <div className="p-5 flex flex-col gap-4">
                      <div className="flex flex-wrap items-baseline gap-3">
                        <span className="text-[24px] font-semibold text-[#D97706] tabular-nums">92%</span>
                        <span className="text-[12px] text-[#6B7280]">forecast density in 26 min · safe max 4.0 ppl/m²</span>
                      </div>
                      <div className="p-3.5 bg-white rounded-lg border border-[#E5E7EB] flex items-start gap-3">
                        <span className="material-symbols-outlined text-[18px] text-[#2563EB] mt-0.5">info</span>
                        <p className="text-[14px] text-[#111827]">
                          Activate the secondary surge barriers at the Central Plaza to slow forward compression.
                        </p>
                      </div>
                      <div className="pt-1 flex flex-wrap items-center gap-3">
                        <button 
                          disabled={dispatchedCards['c2']}
                          onClick={() => openConfirmModal('Central Plaza Secondary Surge Barrier Deploy', 'c2')}
                          className={`px-4 py-2 rounded-lg text-[13px] font-medium transition-colors ${
                            dispatchedCards['c2'] 
                              ? 'bg-gray-200 text-[#6B7280] cursor-not-allowed' 
                              : 'bg-[#2563EB] hover:bg-[#1D4ED8] text-white'
                          }`}
                        >
                          {dispatchedCards['c2'] ? 'Barrier Deployed' : 'Confirm Barrier Deployment'}
                        </button>
                        <button 
                          onClick={() => navigate('/', { state: { focusZone: ALERT_ZONES['c2'] } })}
                          className="text-[13px] font-medium text-[#2563EB] hover:underline inline-flex items-center gap-1"
                        >
                          View on map
                          <span className="material-symbols-outlined text-[14px]">arrow_forward</span>
                        </button>
                      </div>
                    </div>
                  </article>
                )}

                {/* Alert 3 */}
                {(
                  <article className={`bg-[#F9FAFB] border border-[#E5E7EB] rounded-lg overflow-hidden transition-all ${
                    dispatchedCards['c3'] ? 'opacity-50' : ''
                  }`}>
                    <div className="p-4 border-b border-[#E5E7EB] flex flex-wrap items-center justify-between gap-3 bg-white">
                      <div className="flex items-center gap-3">
                        <span className="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[12px] font-medium bg-[#EFF6FF] text-[#2563EB] border border-[#DBEAFE]">
                          <span className="w-1.5 h-1.5 rounded-full bg-[#2563EB]"></span> Priority 3 · Advisory
                        </span>
                        <h2 className="text-[16px] font-semibold text-[#111827]">Water Point West Path Congestion</h2>
                      </div>
                      <div className="flex items-center gap-2">
                        <span className="text-[12px] font-medium text-[#2563EB] tabular-nums">+45% 15m delta</span>
                      </div>
                    </div>
                    <div className="p-5 flex flex-col gap-4">
                      <div className="flex flex-wrap items-baseline gap-3">
                        <span className="text-[24px] font-semibold text-[#2563EB] tabular-nums">+45%</span>
                        <span className="text-[12px] text-[#6B7280]">queue growth over 15 min · wait time 9.5 mins</span>
                      </div>
                      <div className="p-3.5 bg-white rounded-lg border border-[#E5E7EB] flex items-start gap-3">
                        <span className="material-symbols-outlined text-[18px] text-[#2563EB] mt-0.5">info</span>
                        <p className="text-[14px] text-[#111827]">
                          Send the mobile water team to the west path to relieve queue pressure.
                        </p>
                      </div>
                      <div className="pt-1 flex flex-wrap items-center gap-3">
                        <button 
                          disabled={dispatchedCards['c3']}
                          onClick={() => openConfirmModal('Mobile Water Team Deploy', 'c3')}
                          className={`px-4 py-2 rounded-lg text-[13px] font-medium transition-colors ${
                            dispatchedCards['c3'] 
                              ? 'bg-gray-200 text-[#6B7280] cursor-not-allowed' 
                              : 'bg-[#2563EB] hover:bg-[#1D4ED8] text-white'
                          }`}
                        >
                          {dispatchedCards['c3'] ? 'Team En Route' : 'Confirm Action'}
                        </button>
                        <button 
                          onClick={() => navigate('/', { state: { focusZone: ALERT_ZONES['c3'] } })}
                          className="text-[13px] font-medium text-[#2563EB] hover:underline inline-flex items-center gap-1"
                        >
                          View on map
                          <span className="material-symbols-outlined text-[14px]">arrow_forward</span>
                        </button>
                      </div>
                    </div>
                  </article>
                )}
            </div>

            {/* Modal */}
            {actionModal.open && (
              <div className="fixed inset-0 bg-[#111827]/40 z-[100] flex items-center justify-center p-4">
                <div className="bg-white border border-[#E5E7EB] rounded-lg max-w-lg w-full p-6 relative">
                  <div className="flex justify-between items-start pb-4 border-b border-[#E5E7EB] mb-4">
                    <div>
                      <span className="px-2 py-0.5 bg-[#EFF6FF] text-[#2563EB] rounded text-[11px] font-medium">Log Entry Recording</span>
                      <h3 className="text-[18px] font-semibold text-[#111827] mt-1">Confirm Dispatch Execution</h3>
                    </div>
                    <button onClick={() => setActionModal({ open: false, title: '', cardId: null, operator: '' })} className="w-8 h-8 rounded border border-[#E5E7EB] text-[#6B7280] hover:bg-[#F3F4F6] flex items-center justify-center transition-colors">
                      ✕
                    </button>
                  </div>
                  <div className="space-y-4 text-[13px]">
                    <div className="p-3 bg-[#F9FAFB] rounded-lg border border-[#E5E7EB]">
                      <div className="text-[11px] text-[#6B7280] uppercase tracking-wider font-medium">Action Order:</div>
                      <div className="text-[14px] font-semibold text-[#111827] mt-0.5">{actionModal.title}</div>
                    </div>
                    <div className="grid grid-cols-2 gap-3">
                      <div className="p-3 bg-[#F9FAFB] rounded-lg border border-[#E5E7EB]">
                        <span className="text-[11px] text-[#6B7280] block">Duty Officer</span>
                        <span className="font-medium text-[#111827] mt-0.5 block">{actionModal.operator}</span>
                      </div>
                      <div className="p-3 bg-[#F9FAFB] rounded-lg border border-[#E5E7EB]">
                        <span className="text-[11px] text-[#6B7280] block">Timestamp</span>
                        <span className="font-medium text-[#111827] mt-0.5 block tabular-nums">21:42:18 CEST</span>
                      </div>
                    </div>
                    <div className="p-3 bg-[#F9FAFB] rounded-lg border border-[#E5E7EB] text-[12px] text-[#6B7280]">
                      <span className="font-medium text-[#111827] block mb-0.5">Radio Verification Directive:</span>
                      Tactical channel notification will broadcast automatically. Physical field units are bound by protocol to confirm on-station arrival within 180 seconds.
                    </div>
                    <div className="flex items-center gap-3 pt-2">
                      <button 
                        onClick={handleConfirmAction}
                        className="w-full py-2.5 bg-[#2563EB] text-white font-medium rounded-lg text-[13px] hover:bg-[#1D4ED8] transition-colors"
                      >
                        Authorize & Broadcast Order
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* Page explanation */}
            <p className="mt-6 text-center text-[11px] text-[#9CA3AF] leading-relaxed">
              When a spot looks set to overfill, each alert here suggests one action — confirm to send it.
            </p>
          </div>
        </main>
      );
    };

    // Main App with MemoryRouter
    const App = () => {
      const [activeSector, setActiveSector] = useState('ALL');
      const [toast, setToast] = useState({ visible: false, title: '', msg: '' });

      const showToast = (title, msg) => {
        setToast({ visible: true, title, msg });
        setTimeout(() => {
          setToast(prev => ({ ...prev, visible: false }));
        }, 4000);
      };

      return (
        <div className="min-h-screen flex flex-col bg-[#F9FAFB] text-[#111827]">
          <Header 
            activeSector={activeSector} 
            setActiveSector={setActiveSector} 
          />

          <div className="flex-1 flex flex-col">
            <Routes>
              <Route path="/" element={<LiveCrowdMapScreen onShowToast={showToast} />} />
              <Route path="/live-crowd-map" element={<LiveCrowdMapScreen onShowToast={showToast} />} />
              <Route path="/alerts" element={<AlertsActionsScreen onShowToast={showToast} />} />
              <Route path="/alerts-actions" element={<AlertsActionsScreen onShowToast={showToast} />} />
              <Route path="/decisions" element={<DecisionLogScreen onShowToast={showToast} />} />
              <Route path="/decision-log" element={<DecisionLogScreen onShowToast={showToast} />} />
            </Routes>
          </div>

          <Footer />
          <Toast toast={toast} onClose={() => setToast(prev => ({ ...prev, visible: false }))} />
        </div>
      );
    };

    const rootElement = document.getElementById('root');
    const root = createRoot(rootElement);
    root.render(
      <MemoryRouter initialEntries={['/']}>
        <App />
      </MemoryRouter>
    );
  </script>
</body>
</html>
